# Default configuration.
#
# Every value below can be overridden at runtime by an environment variable
# using the `COSMX_` prefix and `__` as the nesting separator, e.g.
# `COSMX_SERVER__PORT=9090` or `COSMX_DATABASE__HOST=mariadb`.
# `docker-compose.yml` relies on that mechanism, so no rebuild is required to
# change the database, the paths or the listening port.
#
# The paths below are meant for local development. Containers are expected to
# override them with the `COSMX_*` environment variables described above.
server:
  # Bind on every interface, otherwise the server is unreachable from outside
  # of its container / host.
  host: "0.0.0.0"
  port: 8080
database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "123456"
  database: "media"
  # option:
  #   max-connections: 100
  #   min-connections: 8
  #   connect-timeout: 8
  #   acquire-timeout: 8
  #   idle-timeout: 10
  #   max-lifetime: 1800
cosmox:
  name: "cosmox server"
  scanner:
    metadata-path: "test/metadata"
  library:
    path: "test/library"
  data:
    path: "test/data"
  plugin:
    path: "test/plugin"
  cache:
    path: "test/cache"
  log:
    path: "test/log"
  proxy:
    http: "http://proxy.server:8889"
    https: "http://proxy.server:8889"
  state:
    path: "test/state"
  auth:
    token-expire-secs: 3600
    refresh-threshold-secs: 900
  qbittorrent:
    server: "http://127.0.0.1:7070"
    username: "admin"
    password: "123456"
